name: Android checks and test APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Native regression tests
        working-directory: android
        run: ./gradlew :app:testReleaseUnitTest -Ptarget-platform=android-arm64 -Psplit-per-abi=true --max-workers=1
      - uses: actions/upload-artifact@v4
        with:
          name: MediaStreamer-test-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
